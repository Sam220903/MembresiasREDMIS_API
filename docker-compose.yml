services: 
  db:
    image: mysql
    volumes:
      - db_data:/var/lib/mysql
      - ./db/MR_DB_V5.sql:/docker-entrypoint-initdb.d/MR_DB_V5.sql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: REDMIS
      MYSQL_DATABASE: mr_db
      MYSQL_USER: mr_user
      MYSQL_PASSWORD: REDMIS
    ports:
      - "3306:3306"
    networks:
      - app_network
volumes:
  db_data:

networks:
  app_network: